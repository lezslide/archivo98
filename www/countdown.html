1em; } .caption { color:var(--ink); font:800 11px "Orbitron",sans-serif; letter-spacing:.3em; text-transform:uppercase; text-shadow:2px 2px 0 var(--shadow); } body.matrix .caption,body.matrix-blue .caption { color:transparent; -webkit-text-fill-color:transparent; -webkit-text-stroke:1px #72ff82; text-shadow:0 0 5px #39ff62; } .offer { display:inline-flex; align-items:center; justify-content:center; min-height:64px; margin-top:4px; padding:0 34px; color:#111; background:var(--accent); border:5px solid #111; box-shadow:8px 8px 0 #111; font:900 clamp(14px,1.7vw,21px) "Orbitron",sans-serif; letter-spacing:.1em; text-decoration:none; text-transform:uppercase; transition:transform .16s ease,box-shadow .16s ease; } .offer:hover { transform:translate(3px,3px); box-shadow:4px 4px 0 #111; } @keyframes shake { 0%,89%,100% { transform:translate(0,0) rotate(0); } 90% { transform:translate(-2px,1px) rotate(-.2deg); } 93% { transform:translate(2px,-1px) rotate(.2deg); } } @media (max-width:620px) { .screen { padding:18px 12px 28px; } .product-stage { width:min(330px,92vw); } #counter { font-size:clamp(28px,10vw,58px); } .caption { letter-spacing:.18em; } .offer { min-height:56px; padding:0 22px; font-size:12px; } } @media (prefers-reduced-motion:reduce) { #counter { animation:none; }

<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.3.1/dist/model-viewer.min.js"></script><script>

<script>
  const DEFAULT_SECONDS = 1800000; const BAGGY_GOAL = 100; let state = { status:"idle", durationSeconds:DEFAULT_SECONDS, startedAt:null, serverCreatedAt:null, theme:"blue", baggyCount:1 }; const counter = document.getElementById("counter");
  function left() { const startedAt = state.startedAt || state.serverCreatedAt; const remaining = state.status === "running" && startedAt ? state.durationSeconds - (Date.now() - Date.parse(startedAt)) / 1000 : state.durationSeconds; return Math.min(state.durationSeconds, Math.max(0, Number.isFinite(remaining) ? remaining : state.durationSeconds)); }
  function render() { counter.textContent = left().toLocaleString("en-US", { minimumFractionDigits:2, maximumFractionDigits:2 }); requestAnimationFrame(render); }
  const SUPABASE_URL = "https://qttxcfbgyfmvyglzwxct.supabase.co";
  const SUPABASE_KEY = "sb_publishable_8zeUhO0eNbsQddb7koQZ1w_VwuK8FjO";
  async function readCountdownState(url, headers = {}) {
    const response = await fetch(url, { cache:"no-store", headers });
    if (!response.ok) return null;
    const data = await response.json();
    const message = data.messages ? data.messages[0] : data[0];
    if (!message) return null;
    const payload = JSON.parse(message.content || "{}");
    return payload.type === "countdown-state" ? { ...payload, serverCreatedAt:payload.serverCreatedAt || message.created_at || null } : null;
  }
  async function sync() {
    const query = `room=eq.global&select=content,created_at&content=like.*countdown-state*&order=created_at.desc&limit=1`;
    try {
      const direct = await readCountdownState(`${SUPABASE_URL}/rest/v1/messages?${query}`, { apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` });

    } catch (_) {}
  }
  function chooseTheme(theme) { state.theme = theme; ["green","matrix","matrix-blue"].forEach(name => document.body.classList.toggle(name, theme === name)); }
  function setTheme(theme) { chooseTheme(theme); }
  function renderBaggyCount() { const node = document.getElementById("baggy-stock"); if (node) node.textContent = String(Math.max(0, Math.min(9999, Number.isFinite(Number(state.baggyCount)) ? Number(state.baggyCount) : 1))); }
  const originalSync = sync;
  sync = async function() { await originalSync(); renderBaggyCount(); };
  renderBaggyCount();
  setTheme("blue"); render(); sync(); setInterval(sync, 1000);
