<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin / cuenta regresiva</title>
  <style>
    :root { color-scheme:dark; --cyan:#19e6ff; --lime:#c4ff42; } * { box-sizing:border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:#edf5ff; background:#080b12; font:15px system-ui,sans-serif; } .panel { width:min(620px,100%); padding:28px; border:1px solid #273246; background:#101522; box-shadow:0 20px 70px #0008; } h1 { margin:0 0 7px; font:800 22px monospace; } p { color:#8e9bb0; } label { display:block; margin:22px 0 7px; color:#bac7db; font-size:12px; text-transform:uppercase; letter-spacing:.12em; } input,button { width:100%; min-height:44px; padding:0 13px; border:1px solid #334158; background:#0b0f18; color:#fff; font:inherit; } button { margin-top:12px; cursor:pointer; } button:hover { border-color:var(--cyan); } button:disabled { opacity:.55; cursor:wait; } .primary { color:#08100b; border-color:var(--lime); background:var(--lime); font-weight:800; } .row { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; } .row button { margin-top:0; } #matrix,#matrix-blue { color:#7cff63; border-color:#7cff63; } #message { min-height:22px; color:var(--cyan); } #message.error { color:#ff8290; } #controls[hidden], #login[hidden] { display:none; } .back { color:#8e9bb0; font-size:12px; } @media (max-width:620px) { .row { grid-template-columns:1fr 1fr; } }
</style>
</head>
<body><main class="panel"><section id="login"><h1>Cuenta regresiva / acceso</h1><p>Panel privado de Archivo98.</p><form id="login-form"><label for="email">Email administrador</label><input id="email" type="email" autocomplete="username" value="tumberjeremy@gmail.com" required><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required><button class="primary" type="submit">Ingresar</button></form></section><section id="controls" hidden><h1>Control de salida</h1><p>La pantalla pública se sincroniza con este estado.</p><label for="duration">Duración en segundos</label><input id="duration" type="number" min="1" step="1" value="1800000"><label for="baggy-count">Unidades disponibles hoy</label><input id="baggy-count" type="number" min="0" max="9999" step="1" value="1"><label>Fondo de pantalla</label><div class="row"><button id="blue" type="button">Azul croma</button><button id="green" type="button">Verde croma</button><button id="matrix" type="button">Matrix negro</button><button id="matrix-blue" type="button">Matrix azul croma</button></div><div class="row" style="margin-top:14px"><button class="primary" id="start" type="button">Iniciar</button><button id="reset" type="button">Reiniciar</button></div><p id="message" role="status"></p><a class="back" href="./countdown.html">Ver pantalla pública</a></section></main>
<script>
  const SUPABASE_URL = "https://qttxcfbgyfmvyglzwxct.supabase.co";
  const SUPABASE_KEY = "sb_publishable_8zeUhO0eNbsQddb7koQZ1w_VwuK8FjO";
  const SESSION_KEY = "archivo98-countdown-admin-session";
  const login = document.getElementById("login"), controls = document.getElementById("controls"), message = document.getElementById("message");
  let theme = "blue", session = null, lastState = null, sending = false;
  function say(text, error = false) { message.textContent = text; message.classList.toggle("error", error); }
  function headers(auth = false) { return { apikey:SUPABASE_KEY, Authorization:`Bearer ${auth && session ? session.access_token : SUPABASE_KEY}`, "Content-Type":"application/json" }; }
  async function request(path, options = {}, auth = false) { const response = await fetch(`${SUPABASE_URL}${path}`, { ...options, cache:"no-store", headers:{ ...headers(auth), ...(options.headers || {}) } }); const text = await response.text(); let body = null; try { body = text ? JSON.parse(text) : null; } catch (_) {} if (!response.ok) throw new Error(body?.msg || body?.message || body?.error_description || body?.error || text || `Error ${response.status}`); return body; }
  function restoreSession() { try { const saved = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); if (saved?.access_token && saved?.expires_at > Math.floor(Date.now() / 1000) + 30) session = saved; } catch (_) {} }
  function showControls() { login.hidden = true; controls.hidden = false; addStockButton(); loadCurrentStock(); }
  function addStockButton() { if (document.getElementById("save-stock")) return; const button = document.createElement("button"); button.id = "save-stock"; button.type = "button"; button.className = "primary"; button.textContent = "Actualizar unidades"; button.addEventListener("click", () => send("theme").catch(error => say(error.message, true))); document.getElementById("baggy-count").after(button); }
  async function loadCurrentStock() { try { const current = await currentState(); if (!current) return; lastState = current; theme = current.theme || theme; if (Number.isFinite(Number(current.durationSeconds))) document.getElementById("duration").value = Math.max(1, Number(current.durationSeconds)); if (Number.isFinite(Number(current.baggyCount))) document.getElementById("baggy-count").value = Math.max(0, Math.min(9999, Number(current.baggyCount))); } catch (_) {} }
  async function currentState() { const rows = await Promise.race([request(`/rest/v1/messages?room=eq.global&select=content,created_at&content=like.*countdown-state*&order=created_at.desc,id.desc&limit=1`), new Promise((_, reject) => setTimeout(() => reject(new Error("Tiempo agotado al leer el estado")), 5000))]); const row = rows?.[0]; if (!row) return null; try { const payload = JSON.parse(row.content || "{}"); return payload.type === "countdown-state" ? { ...payload, serverCreatedAt:payload.serverCreatedAt || row.created_at } : null; } catch (_) { return null; } }
  async function send(action) { if (!session?.user?.id) throw new Error("La sesión expiró. Volvé a ingresar al Admin."); if (sending) { say("Ya hay una operación en curso. Esperá unos segundos.", true); return; } sending = true; say(action === "start" ? "Iniciando…" : action === "reset" ? "Reiniciando…" : "Aplicando cambios…"); try { const previous = action === "theme" ? (lastState || await currentState()) : null; if (action === "theme" && !previous) throw new Error("No pude recuperar el estado actual; no se cambió el contador."); const startedAt = new Date().toISOString(); const rawBaggyCount = Number(document.getElementById("baggy-count")?.value); const baggyCount = Math.max(0, Math.min(9999, Number.isFinite(rawBaggyCount) ? rawBaggyCount : 1)); const payload = action === "theme" && previous ? { ...previous, theme, baggyCount } : { type:"countdown-state", status:action === "start" ? "running" : "idle", durationSeconds:Number(document.getElementById("duration").value) || 1800000, startedAt:action === "start" ? startedAt : null, theme, baggyCount }; await request("/rest/v1/messages", { method:"POST", headers:{ Prefer:"return=minimal" }, body:JSON.stringify({ room:"global", user_id:session.user.id, username:"Countdown", content:JSON.stringify(payload) }) }, true); lastState = payload; say(action === "start" ? "Cuenta y unidades actualizadas para todos." : action === "reset" ? "Cuenta reiniciada para todos." : "Cambios actualizados sin reiniciar el tiempo."); } finally { sending = false; } }
  async function loginWithPassword(event) { event.preventDefault(); say("Ingresando..."); const button = event.target.querySelector("button"); button.disabled = true; try { const data = await request("/auth/v1/token?grant_type=password", { method:"POST", body:JSON.stringify({ email:document.getElementById("email").value, password:document.getElementById("password").value }) }); session = data; session.expires_at = Math.floor(Date.now() / 1000) + Number(data.expires_in || 3600); localStorage.setItem(SESSION_KEY, JSON.stringify(session)); showControls(); say("Listo para iniciar."); } catch (error) { say(`No se pudo ingresar: ${error.message}`, true); } finally { button.disabled = false; } }
  function action(id, value, name = "theme") { document.getElementById(id).addEventListener("click", async () => { theme = value; try { await send(name); } catch (error) { say(error.message, true); } }); }
  document.getElementById("login-form").addEventListener("submit", loginWithPassword); action("blue", "blue"); action("green", "green"); action("matrix", "matrix"); action("matrix-blue", "matrix-blue"); document.getElementById("start").addEventListener("click", () => send("start").catch(error => say(error.message, true))); document.getElementById("reset").addEventListener("click", () => send("reset").catch(error => say(error.message, true)));
  restoreSession(); if (session) showControls();
</script></body></html>
